[project]
name = "qubounds"
version = "0.1.0"
description = ""
authors = [
    {name = "vedina",email = "jeliazkova.nina@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ploomber (>=0.23.3,<0.24.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "matplotlib (>=3.10.5,<4.0.0)",
    # upper cap removed 2026-09-19: it was poetry's default caret bound, not
    # a tested requirement. The only rdkit API this package uses is
    # AllChem.GetMorganFingerprintAsBitVect (descriptors/ecfp.py), verified
    # working on 2026.03.6 -- deprecation warning ("please use
    # MorganGenerator"), not removal. The cap blocked reuse from projects on
    # current rdkit; switch ecfp.py to MorganGenerator before the removal
    # actually lands.
    "rdkit (>=2025.3.5)",
    "plotly (>=6.2.0,<7.0.0)",
    "statsmodels (>=0.14.5,<0.15.0)",
    "chardet (>=5.2.0,<6.0.0)",
    "scikit-learn (>=1.7.1,<2.0.0)",
    "xlsxwriter (>=3.2.5,<4.0.0)",
    "mapie (>=1.2.0,<2.0.0)",
    "mord (>=0.7,<0.8)",
    "lightgbm (>=4.6.0,<5.0.0)",
]

[project.optional-dependencies]
# catboost is imported ONLY by tasks/tutorial/mapie_native.py and
# tasks/tutorial/mapie_classification.py -- nothing under src/qubounds/ uses
# it. Keeping it in the core set made every consumer of the library install a
# gradient-boosting runtime to use the calibration layer.
tutorial = ["catboost>=1.2.10"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
